# Dhvaj Desk demo images: the portal API and web app, built from this branch,
# for `docker compose up` in the public dhvaj-desk repo. Demo use only: dev
# sign-in, made-up data. Nothing here deploys anywhere.
#
#   ghcr.io/intenzee/dhvaj-desk-portal-api:demo
#   ghcr.io/intenzee/dhvaj-desk-portal-web:demo   (API at http://localhost:3101)
name: Demo images (Dhvaj Desk)

on:
  push:
    branches: [switch-integration]
    paths:
      - '.github/workflows/demo-images.yml'
      - 'apps/**'
      - 'packages/**'
      - 'db/**'
      - 'scripts/deploy/**'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: demo-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            build-args: ''
          - image: web
            build-args: |
              NEXT_PUBLIC_API_URL=http://localhost:3101/api/v1
              NEXT_PUBLIC_CLIENT_UPLOAD_ENABLED=true
    steps:
      - uses: actions/checkout@v4

      # The public image carries only what the demo needs: no seed that names
      # a real person (owner_entra.sql is for a firm's own Entra sign-in).
      - name: Keep the demo image to demo data
        run: rm -f db/seeds/owner_entra.sql

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ghcr.io/intenzee/dhvaj-desk-portal-${{ matrix.image }}:demo
            ghcr.io/intenzee/dhvaj-desk-portal-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/intenzee/dhvaj-desk
            org.opencontainers.image.title=Dhvaj Portal ${{ matrix.image }} (Dhvaj Desk demo)
            org.opencontainers.image.description=Dhvaj Portal ${{ matrix.image }} for the Dhvaj Desk demo: dev sign-in, made-up data. Not for a real firm.
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
