# Local development infrastructure for the HSDG Portal.
# Brings up the system-of-record (PostgreSQL) and cache (Redis).
# The API and web apps run on the host (npm) during development.
#
#   npm run db:up      # start postgres + redis
#   npm run db:migrate # apply migrations (as hsdg_migrator)
#   npm run api        # run the API against them

services:
  postgres:
    image: postgres:16-alpine
    container_name: hsdg-postgres
    environment:
      # Superuser is used ONLY for container bootstrap (role/db creation in
      # init scripts). The application never connects with these credentials.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Host 5433 to avoid clashing with a local (Homebrew) PostgreSQL on 5432.
      # Container-internal port stays 5432.
      - '5433:5432'
    volumes:
      - hsdg-pgdata:/var/lib/postgresql/data
      # Init scripts run in filename order on first start of an empty volume.
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hsdg']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hsdg-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - hsdg-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # OnlyOffice Document Server — the in-app Office editor (Excel/Word/PDF).
  # Heavy (~1.5–2 GB), so it is NOT part of `npm run db:up`; start it on demand
  # with `npm run oo:up` (and `npm run oo:down` to stop). The API and browser
  # reach it as follows:
  #   - browser  → http://localhost:8080         (loads the editor script)
  #   - DS → API → http://host.docker.internal:3001 (fetch file + save callback)
  # JWT is enabled and the secret is shared with the API (ONLYOFFICE_JWT_SECRET).
  # The dev secret below is INSECURE — override it (both sides) in production.
  onlyoffice:
    image: onlyoffice/documentserver:8.1
    container_name: hsdg-onlyoffice
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: 'dev-onlyoffice-shared-secret-change-me'
      JWT_HEADER: 'Authorization'
      JWT_IN_BODY: 'true'
    ports:
      - '8080:80'
    extra_hosts:
      # Lets the container reach the host-run API on Linux (automatic on Docker
      # Desktop for Mac/Windows, harmless there).
      - 'host.docker.internal:host-gateway'
    volumes:
      - hsdg-onlyoffice-data:/var/www/onlyoffice/Data
      - hsdg-onlyoffice-logs:/var/log/onlyoffice
    restart: unless-stopped

volumes:
  hsdg-pgdata:
  hsdg-redisdata:
  hsdg-onlyoffice-data:
  hsdg-onlyoffice-logs:
